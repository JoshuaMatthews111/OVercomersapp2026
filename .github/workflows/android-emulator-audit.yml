# Build the OGN app and drive it on a real Android emulator.
#
# The companion to the iOS lane. Android needs no Mac, so this runs on a free
# Linux runner with hardware acceleration switched on — which is why an
# emulator boots here in minutes rather than never.
#
# Unlike the iOS lane this one does not only photograph screens: it presses
# controls and reads the screen back to find the ones that do nothing. See
# qa/android-emulator-drive.mjs for why ambient movement is measured first.
name: Android emulator audit

on:
  workflow_dispatch:
  push:
    branches: [nexora/cloud-device-lanes]

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Let the emulator use hardware acceleration
        # Without KVM the emulator runs in pure software and is too slow to
        # finish inside any sane timeout.
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -la /dev/kvm

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Keep Gradle's downloads between runs
        # setup-java's own cache keys on gradle files in the checkout, and
        # there are none: android/ is generated by prebuild a few steps later.
        # So the cache is keyed on the lockfile instead, which is what decides
        # the native dependencies. Eighteen of the run's twenty minutes were
        # Gradle fetching and compiling the same things again.
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Write the app's public configuration
        run: |
          cat > .env.local <<ENV
          EXPO_PUBLIC_SUPABASE_URL=${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_BIBLE_PROVIDER=${{ secrets.EXPO_PUBLIC_BIBLE_PROVIDER }}
          EXPO_PUBLIC_BIBLE_API_ENDPOINT=${{ secrets.EXPO_PUBLIC_BIBLE_API_ENDPOINT }}
          EXPO_PUBLIC_BIBLE_API_KEY=${{ secrets.EXPO_PUBLIC_BIBLE_API_KEY }}
          EXPO_PUBLIC_BIBLE_ID_KJV=${{ secrets.EXPO_PUBLIC_BIBLE_ID_KJV }}
          EXPO_PUBLIC_BIBLE_ID_NLT=${{ secrets.EXPO_PUBLIC_BIBLE_ID_NLT }}
          EXPO_PUBLIC_BIBLE_ID_AMP=${{ secrets.EXPO_PUBLIC_BIBLE_ID_AMP }}
          EXPO_PUBLIC_GIVING_URL=${{ secrets.EXPO_PUBLIC_GIVING_URL }}
          EXPO_PUBLIC_LIVE_STREAM_URL=${{ secrets.EXPO_PUBLIC_LIVE_STREAM_URL }}
          ENV
          echo "wrote $(grep -c . .env.local) settings"

      - name: Generate the native Android project
        # android/ is not committed, so it is regenerated from app.json every
        # time and can never drift from it.
        run: npx expo prebuild --platform android --no-install

      - name: Build a release APK
        # Release so the JavaScript is bundled in. A debug build expects Metro
        # and would show a red error screen instead of the app. Expo's template
        # signs release with the debug key, which is all an emulator needs.
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_BIBLE_PROVIDER: ${{ secrets.EXPO_PUBLIC_BIBLE_PROVIDER }}
          EXPO_PUBLIC_BIBLE_API_ENDPOINT: ${{ secrets.EXPO_PUBLIC_BIBLE_API_ENDPOINT }}
          EXPO_PUBLIC_BIBLE_API_KEY: ${{ secrets.EXPO_PUBLIC_BIBLE_API_KEY }}
          EXPO_PUBLIC_BIBLE_ID_KJV: ${{ secrets.EXPO_PUBLIC_BIBLE_ID_KJV }}
          EXPO_PUBLIC_BIBLE_ID_NLT: ${{ secrets.EXPO_PUBLIC_BIBLE_ID_NLT }}
          EXPO_PUBLIC_BIBLE_ID_AMP: ${{ secrets.EXPO_PUBLIC_BIBLE_ID_AMP }}
          EXPO_PUBLIC_GIVING_URL: ${{ secrets.EXPO_PUBLIC_GIVING_URL }}
          EXPO_PUBLIC_LIVE_STREAM_URL: ${{ secrets.EXPO_PUBLIC_LIVE_STREAM_URL }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -x lint
          # Hand the emulator step an absolute path. Its script ran with a
          # different working directory, its own find came back empty, and
          # adb was asked to install "" — which is how a green build turned
          # into a run that installed nothing and hung for 74 minutes.
          APK="$(find "$PWD/app/build/outputs/apk" -name '*.apk' | head -1)"
          if [ -z "$APK" ]; then echo "::error::no APK produced"; exit 1; fi
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"
          echo "built $APK ($(du -h "$APK" | cut -f1))"

      - name: The rules about what may be pressed must hold before anything is
        run: node --test qa/control-policy.test.mjs

      - name: Drive the app on an emulator
        # Bounded and non-fatal on purpose. The emulator action has hung on
        # teardown after a failure, and cancelling the job to unstick it threw
        # away every screenshot already taken; the drive script now always
        # writes its report, so the artifacts are worth uploading either way.
        timeout-minutes: 35
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        env:
          QA_EMAIL: ${{ secrets.QA_EMAIL }}
          QA_PASSWORD: ${{ secrets.QA_PASSWORD }}
          APP_BUNDLE_ID: com.overcomers.globalnetwork.app
          APP_SCHEME: ognapp
          SHOT_DIR: qa/android-shots
          # The OGN app is wired to the live Supabase project, so deletion
          # stays blocked no matter which account signs in. Only a throwaway
          # backend would change this.
          BACKEND_IS_DISPOSABLE: "false"
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb wait-for-device
            echo "installing $APK_PATH"
            adb install -r "$APK_PATH"
            node qa/android-emulator-drive.mjs
            # Read the log while the phone still exists. After this step the
            # action kills the emulator, and adb with no device waits forever.
            timeout 30 adb logcat -d > qa/android-shots/device.log 2>/dev/null || true

      - name: Make sure there is something to upload
        if: always()
        run: mkdir -p qa/android-shots && ls -la qa/android-shots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-screenshots
          path: qa/android-shots/
